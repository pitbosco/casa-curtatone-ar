<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Curtatone · 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { --blu: #011858; --paper: #f3efe6; --ink: #1d1d1b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { -webkit-tap-highlight-color: transparent; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  .bottom { position: fixed; z-index: 2; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
  .ar { width: 100%; min-height: 72px; border: 0; border-radius: 18px; padding: 16px 20px; background: var(--blu); color: #fff; font: 700 23px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; box-shadow: 0 4px 16px rgba(0,0,0,.2); cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>

<model-viewer id="mv" src="assets/casa.glb" ios-src="assets/casa.usdz" alt="Modello 3D di Casa Curtatone"
  ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto"
  camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1" exposure="1.05"
  camera-orbit="35deg 70deg auto" loading="eager">
  <!-- Slot del pulsante AR: model-viewer lo mostra solo se il telefono supporta la realtà aumentata -->
  <button slot="ar-button" class="hidden" id="arSlot"></button>
</model-viewer>

<div class="bottom" id="withAr">
  <button class="ar" id="go">Esplora la casa in realtà aumentata</button>
</div>

<script>
  // Un solo pulsante: apre la realtà aumentata del telefono (Quick Look su iPhone, Scene Viewer/WebXR su Android).
  // Se il telefono non la supporta resta il modello 3D da girare con il dito.
  const mv = document.getElementById('mv');
  const check = () => {
    const ok = mv.canActivateAR;
    document.getElementById('withAr').classList.toggle('hidden', !ok);
  };
  mv.addEventListener('load', check);
  setTimeout(check, 1500);
  document.getElementById('go').onclick = () => mv.activateAR();
</script>
</body>
</html>

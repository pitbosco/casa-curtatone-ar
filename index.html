<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Casa Curtatone · AR</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  :root { --ink: #1d1d1b; --paper: #f3efe6; --blu: #011858; --accent: #b5452c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #ar { position: fixed; inset: 0; touch-action: none; }
  .hidden { display: none !important; }

  /* Schermata iniziale: testo grande, poche parole, pulsanti grandi */
  .panel { position: fixed; inset: 0; z-index: 10; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 28px 22px calc(28px + env(safe-area-inset-bottom)); background: var(--paper); }
  .panel h1 { font: 700 42px/1.05 Georgia, serif; margin: 0; color: var(--blu); }
  .panel .sub { font: 20px/1.3 Georgia, serif; margin: -10px 0 0; color: var(--blu); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; font-size: 20px; line-height: 1.35; }
  .steps .n { width: 40px; height: 40px; border-radius: 50%; background: var(--blu); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 20px; }
  button, .btn { font: 700 21px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif; border: 0; border-radius: 16px; min-height: 64px; padding: 16px 22px; background: var(--blu); color: #fff; text-decoration: none; text-align: center; cursor: pointer; }
  .btn.secondary { background: #fff; color: var(--blu); border: 3px solid var(--blu); }
  #status { font-size: 19px; line-height: 1.4; color: var(--accent); min-height: 1.4em; text-align: center; }

  /* Durante l'AR */
  .pill { background: rgba(255,255,255,.94); color: var(--ink); border-radius: 14px; padding: 12px 16px; font-size: 19px; line-height: 1.3; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  #frame { position: fixed; z-index: 5; left: 50%; top: 45%; transform: translate(-50%, -50%); width: min(72vw, 360px); aspect-ratio: 1; border: 4px dashed rgba(255,255,255,.95); border-radius: 18px; pointer-events: none; }
  #message { position: fixed; z-index: 6; left: 16px; right: 16px; top: calc(16px + env(safe-area-inset-top)); pointer-events: none; }
  #toolbar { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; justify-content: center; align-items: center; padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); }
  #toolbar .round { width: 64px; height: 64px; padding: 0; border-radius: 50%; font-size: 32px; line-height: 1; background: rgba(255,255,255,.94); color: var(--blu); box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  #toolbar #room { font-size: 19px; padding: 14px 18px; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="ar"></div>

<section class="panel" id="intro">
  <h1>Casa Curtatone</h1>
  <p class="sub">Sergio Jaretti · Elio Luzi — Torino</p>
  <ol class="steps">
    <li><span class="n">1</span><span>Premi <b>«Inizia»</b>.</span></li>
    <li><span class="n">2</span><span>Il telefono chiede uno o due permessi: premi sempre <b>«Consenti»</b>.</span></li>
    <li><span class="n">3</span><span>Inquadra il disegno: la casa compare sopra il foglio.</span></li>
  </ol>
  <button id="start">Inizia</button>
  <a class="btn secondary" id="roomIntro" href="stanza.html">Metti la casa nella stanza</a>
  <div id="status" role="status"></div>
</section>

<div id="frame" class="hidden"></div>
<div id="message" class="hidden"><div class="pill" id="messageText"></div></div>
<div id="toolbar" class="hidden">
  <button class="round" id="zoomOut" aria-label="Rimpicciolisci">−</button>
  <button class="round" id="zoomIn" aria-label="Ingrandisci">+</button>
  <button class="round" id="turn" aria-label="Ruota la casa">⟳</button>
  <button id="room">Nella stanza</button>
</div>
<!-- Usato solo per aprire l'AR di sistema: Quick Look su iPhone, Scene Viewer/WebXR su Android -->
<model-viewer id="mv" loading="eager" src="assets/casa.glb" ios-src="assets/casa.usdz" ar ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor" ar-scale="auto" alt="Casa Curtatone" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0"></model-viewer>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MindARThree } from 'mindar-image-three';

const $ = (id) => document.getElementById(id);
const status = (t) => { $('status').textContent = t; };
let messageTimer = 0;
function message(text, seconds = 0) {
  clearTimeout(messageTimer);
  $('messageText').textContent = text;
  $('message').classList.toggle('hidden', !text);
  if (text && seconds) messageTimer = setTimeout(() => $('message').classList.add('hidden'), seconds * 1000);
}

const mindar = new MindARThree({
  container: $('ar'),
  imageTargetSrc: 'assets/marker-pianta.mind', // 0: icona della mostra, 1: variante con cornice e testi
  uiScanning: 'no', uiLoading: 'no', uiError: 'no',
  // Filtro di MindAR quasi disattivato: lo smorzamento lo facciamo noi nello spazio (vedi sotto),
  // altrimenti il modello resta indietro e "scivola" quando si muove il telefono.
  filterMinCF: 1, filterBeta: 1000,
  missTolerance: 10,
});
const { renderer, scene, camera } = mindar;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8070, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);

// Il modello sta in un gruppo nostro, posizionato ogni fotogramma sopra il foglio.
// Nel riferimento del foglio: piano XY largo 1 unità, Z verso chi guarda.
const sheet = new THREE.Group();
sheet.matrixAutoUpdate = false;
sheet.visible = false;
scene.add(sheet);
const stage = new THREE.Group();
stage.rotation.x = Math.PI / 2; // il modello (Y in alto) si alza dal foglio
sheet.add(stage);

sun.position.set(0.6, 1.5, 0.8); sun.target = stage;
stage.add(sun);
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: .1, far: 5 });
const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), new THREE.ShadowMaterial({ opacity: .3 }));
shadowPlane.rotation.x = -Math.PI / 2; shadowPlane.receiveShadow = true;
stage.add(shadowPlane);

const pivot = new THREE.Group();
stage.add(pivot);

const modelReady = new GLTFLoader().setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/')).loadAsync('assets/casa.glb').then((gltf) => {
  const m = gltf.scene;
  m.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  // Normalizza: impronta grande l'80% del marker, centrata, appoggiata sul foglio.
  const box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const k = 0.8 / Math.max(size.x, size.z);
  m.scale.setScalar(k);
  m.position.set(-c.x * k, -box.min.y * k, -c.z * k);
  pivot.add(m);
});

// ---------- Aggancio al foglio ----------
// Il foglio è fermo sul tavolo. Teniamo la sua posizione in un riferimento che non ruota con il
// telefono (giroscopio): le rotazioni del telefono vengono compensate subito, senza ritardo,
// e il tremolio del riconoscimento si smorza lì, dove il foglio non si muove.
// Se il disegno non si riconosce per un po' (visto di sbieco), la casa resta dov'era.
const anchors = [mindar.addAnchor(0), mindar.addAnchor(1)]; // stessa casa su entrambi i marker
let anchor = null, tracking = false, lostAt = 0, everFound = false;

const gyro = { q: new THREE.Quaternion(), ok: false };
{
  const zee = new THREE.Vector3(0, 0, 1), euler = new THREE.Euler(), q0 = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), D = Math.PI / 180;
  window.addEventListener('deviceorientation', (e) => {
    if (e.alpha == null) return;
    const screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    euler.set(e.beta * D, e.alpha * D, -e.gamma * D, 'YXZ');
    gyro.q.setFromEuler(euler).multiply(q1).multiply(q0.setFromAxisAngle(zee, -screenAngle * D));
    gyro.ok = true;
  });
}
async function askGyro() { // iOS chiede il permesso, e solo dopo un tocco dell'utente
  try { if (window.DeviceOrientationEvent?.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) { console.warn(e); }
}

const world = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3(1, 1, 1), ok: false };
const meas = { p: new THREE.Vector3(), q: new THREE.Quaternion(), s: new THREE.Vector3() };
const lastRaw = new THREE.Matrix4(), tmp = new THREE.Matrix4(), rot = new THREE.Matrix4();
const SMOOTH = 0.3; // quanto conta ogni nuova misura (0..1): più basso = più fermo ma più lento a correggersi

function updateSheet() {
  if (tracking && anchor) {
    const raw = anchor.group.matrix;
    if (!raw.equals(lastRaw)) { // nuova misura dal riconoscimento
      lastRaw.copy(raw);
      tmp.copy(raw);
      if (gyro.ok) tmp.premultiply(rot.makeRotationFromQuaternion(gyro.q));
      tmp.decompose(meas.p, meas.q, meas.s);
      if (!world.ok) { world.p.copy(meas.p); world.q.copy(meas.q); world.s.copy(meas.s); world.ok = true; }
      else { world.p.lerp(meas.p, SMOOTH); world.q.slerp(meas.q, SMOOTH); world.s.lerp(meas.s, SMOOTH); }
    }
  }
  if (!world.ok) return;
  sheet.matrix.compose(world.p, world.q, world.s);
  if (gyro.ok) sheet.matrix.premultiply(rot.makeRotationFromQuaternion(gyro.q).invert());
  sheet.matrixWorldNeedsUpdate = true;
}

for (const a of anchors) {
  a.onTargetFound = () => {
    anchor = a; tracking = true;
    // Ritrovato dopo una pausa lunga: riposiziona subito invece di scivolare fin lì.
    if (performance.now() - lostAt > 1500) world.ok = false;
    sheet.visible = true;
    $('frame').classList.add('hidden');
    if (!everFound) { everFound = true; message('Per girare la casa, trascina con un dito. Per ingrandirla, usa i pulsanti + e −.', 8); }
    else message('');
  };
  a.onTargetLost = () => {
    if (a !== anchor) return;
    tracking = false; lostAt = performance.now();
  };
}

// Se il disegno resta fuori vista a lungo, la casa sparisce e torna l'invito a inquadrarlo.
setInterval(() => {
  if (!tracking && sheet.visible && performance.now() - lostAt > (gyro.ok ? 8000 : 2500)) {
    sheet.visible = false;
    $('frame').classList.remove('hidden');
    message('Inquadra di nuovo il disegno');
  }
}, 500);

// ---------- Ruotare e ingrandire (senza spostare la casa dal foglio) ----------
let zoom = 1, drag = 0, turning = 0, lastTap = 0;
const setZoom = (z) => { zoom = Math.max(0.4, Math.min(4, z)); };
$('zoomIn').onclick = () => setZoom(zoom * 1.3);
$('zoomOut').onclick = () => setZoom(zoom / 1.3);
$('turn').onclick = () => { turning += Math.PI / 4; };

const pointers = new Map();
let pinchStart = null;
const el = renderer.domElement.parentElement;
el.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), zoom };
  }
  if (pointers.size === 1) {
    if (e.timeStamp - lastTap < 300) { zoom = 1; drag = 0; turning = 0; } // doppio tocco: ripristina
    lastTap = e.timeStamp;
  }
});
el.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) drag += dx * 0.01;
  else if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    setZoom(pinchStart.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinchStart.d);
  }
});
const up = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinchStart = null; };
el.addEventListener('pointerup', up);
el.addEventListener('pointercancel', up);

// ---------- Nella stanza: AR di sistema, ancorata al pavimento, ci si cammina intorno ----------
const mv = $('mv');
let running = false;
$('room').onclick = async () => {
  if (!mv.canActivateAR) { location.href = 'stanza.html'; return; }
  if (running) { mindar.stop(); running = false; } // libera la fotocamera per l'AR di sistema
  mv.activateAR();
  $('intro').classList.remove('hidden');
  for (const id of ['toolbar', 'frame', 'message']) $(id).classList.add('hidden');
  $('start').textContent = 'Torna al disegno';
  $('start').disabled = false;
  status('');
};

$('start').onclick = async () => {
  askGyro();
  $('start').disabled = true;
  status('Un momento…');
  try {
    await Promise.all([modelReady, mindar.start()]);
    running = true;
  } catch (e) {
    console.error(e);
    status('Non riesco ad aprire la fotocamera. Puoi premere «Metti la casa nella stanza».');
    $('start').disabled = false;
    return;
  }
  status('');
  $('intro').classList.add('hidden');
  $('toolbar').classList.remove('hidden');
  if (!sheet.visible) { $('frame').classList.remove('hidden'); message('Inquadra il disegno, tutto intero'); }
  let shown = 0;
  renderer.setAnimationLoop(() => {
    shown += (turning - shown) * 0.15; // rotazione morbida del pulsante ⟳
    pivot.rotation.y = drag + shown;
    pivot.scale.setScalar(zoom);
    updateSheet();
    renderer.render(scene, camera);
  });
};

// Dal pannello iniziale apre direttamente l'AR di sistema.
$('roomIntro').onclick = (e) => { e.preventDefault(); $('room').onclick(); };
</script>
</body>
</html>

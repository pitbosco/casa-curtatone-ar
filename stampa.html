<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Casa Curtatone · foglio da stampare</title>
<style>
  @page { size: A4 portrait; margin: 0; }
  :root { --ink: #1d1d1b; --paper: #f3efe6; --accent: #b5452c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ccc; font-family: Georgia, serif; color: var(--ink); }
  .sheet { width: 210mm; height: 297mm; margin: 10mm auto; background: #fff; padding: 14mm 15mm; display: flex; flex-direction: column; gap: 8mm; }
  .marker { width: 180mm; height: 180mm; display: block; }
  .bottom { display: flex; gap: 10mm; align-items: center; }
  .qr { width: 42mm; height: 42mm; flex: none; }
  h1 { margin: 0 0 2mm; font-size: 20pt; }
  ol { margin: 0; padding-left: 5mm; font: 10.5pt/1.45 system-ui, sans-serif; }
  .url { font: 9pt monospace; margin-top: 2mm; color: #555; }
  .bar { width: 22mm; height: 2mm; background: var(--accent); margin-bottom: 3mm; }
  @media print { html, body { background: #fff; } .sheet { margin: 0; } }
</style>
</head>
<body>
<div class="sheet">
  <img class="marker" src="assets/marker.png" alt="Marker">
  <div class="bottom">
    <img class="qr" src="assets/qr.svg" alt="QR code">
    <div>
      <div class="bar"></div>
      <h1>Il modello in realtà aumentata</h1>
      <ol>
        <li>Inquadra il QR code con la fotocamera del telefono.</li>
        <li>Premi <b>Avvia</b> e consenti l'uso della fotocamera.</li>
        <li>Inquadra il disegno qui sopra: la casa comparirà sul foglio.</li>
      </ol>
      <div class="url">pitbosco.github.io/casa-curtatone-ar</div>
    </div>
  </div>
</div>
</body>
</html>
